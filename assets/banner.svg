<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="github-actions-ai-agent banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="90" r="220" fill="#7c3aed" opacity="0.12"/><circle cx="140" cy="600" r="260" fill="#0ea5e9" opacity="0.10"/>
  <text x="90" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#94a3b8" letter-spacing="3">DURABLE  /  MEMORY-EQUIPPED  /  READ-ONLY</text>
  <text x="90" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)">github-actions-ai-agent</text>
  <text x="90" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e2e8f0">An agent that triages failed GitHub Actions runs,</text>
  <text x="90" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e2e8f0">remembers you, and survives a crashed worker.</text>
  <text x="90" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Gemma 4 on Ollama  ·  Google ADK  ·  Temporal  ·  Supermemory</text>
  <rect x="90" y="430" width="220" height="100" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/><text x="200" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">GitHub Actions</text><text x="200" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#fbbf24">failed run</text><path d="M316 480 H364" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="430" width="220" height="100" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="480" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Agent</text><text x="480" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#34d399">Gemma 4 + ADK</text><path d="M596 480 H644" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="430" width="220" height="100" rx="16" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5"/><text x="760" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Temporal</text><text x="760" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a78bfa">durable steps</text><path d="M876 480 H924" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="430" width="220" height="100" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="2.5"/><text x="1040" y="473" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Memory</text><text x="1040" y="503" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f472b6">Supermemory</text>
</svg>
